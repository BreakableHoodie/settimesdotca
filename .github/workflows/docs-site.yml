# Builds the MkDocs site and publishes it to GitHub Pages at docs.settimes.ca.
#
# History: Pages is unavailable to private repos on the Free plan, so this site
# was retired on 2026-09-16 when the repo went private (#1172). It was restored
# on 2026-09-25 when the repo went public again.
#
# If the repo goes private again, retire the site in the SAME change: drop the
# `deploy` job, delete `docs/CNAME`, and delete the zone's `docs.settimes.ca`
# CNAME. A custom domain left pointing at a disabled Pages site can be claimed
# by someone else (subdomain takeover).
#
# DNS: CNAME docs.settimes.ca -> breakablehoodie.github.io, unproxied, TTL auto.
#
# Everything under docs/ is published unless mkdocs.yml's `exclude_docs` names
# it; leaving a file out of `nav` does not keep it off the site.
name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-site.yml"
      # Symlinked into docs/ (single-source); edits land on the root paths,
      # so watch them too or the site drifts until the next docs/** push.
      - "CONTRIBUTING.md"
      - "SECURITY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    # Only the deploy job gets these, so the build job's pip install runs
    # without any Pages or OIDC rights.
    permissions:
      pages: write
      id-token: write
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
