name: Update Visual Snapshots

on:
    workflow_dispatch:
        inputs:
            branch:
                description: Branch to update snapshots on (defaults to triggering branch)
                required: false
                type: string

concurrency:
    group: update-visual-snapshots-${{ inputs.branch || github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    update-snapshots:
        name: Regenerate linux snapshots and commit
        runs-on: ubuntu-latest
        timeout-minutes: 35

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.branch || github.ref_name }}
                  fetch-depth: 1

            - name: E2E environment
              uses: ./.github/actions/e2e-env
              with:
                  e2e-admin-password: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  e2e-admin-email: ${{ secrets.E2E_ADMIN_EMAIL }}

            - name: Regenerate visual snapshots
              env:
                  ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
              run: npx playwright test e2e/visual-regression.spec.js --update-snapshots

            - name: Commit updated snapshots
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add e2e/visual-regression.spec.js-snapshots/
                  if git diff --cached --quiet; then
                      echo "No snapshot changes to commit"
                  else
                      git commit -m "chore: update linux visual regression snapshots [skip ci]"
                      git push
                  fi
