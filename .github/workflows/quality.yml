name: Quality Checks

on:
  pull_request:
    branches: [main, dev]
    # Skip docs-only PRs — but docs/api-spec.yaml is the OpenAPI contract this
    # workflow's "OpenAPI Validation" job exists to check, so re-include it.
    # (paths patterns evaluate in order; the last matching pattern decides.)
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/api-spec.yaml"

permissions:
  contents: read

# These checks only run on PRs and focus on fast quality gates,
# including early OpenAPI drift detection before merge.

env:
  NODE_VERSION: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Validate OpenAPI spec
        run: npm run validate:openapi

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

  format-check-backend:
    name: Format Check (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check backend code formatting
        run: npm run format:check

  lint-backend:
    name: ESLint (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check setup-complete.sql matches migrations
        run: node scripts/check-schema-drift.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Backend coverage
        run: npm run test:coverage

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend coverage
        working-directory: frontend
        run: npm run test:coverage

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: npm run test:a11y

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify Chrome installed
        working-directory: .
        run: google-chrome --version

      - name: Prepare E2E environment
        uses: ./.github/actions/e2e-env
        with:
          install-playwright: 'false'
          # Lighthouse only loads public pages and never authenticates, so this
          # job is deliberately not handed admin credentials.
          seed-admin: 'false'

      - name: Run Lighthouse CI
        working-directory: frontend
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CI: true

      # The gate has failed with CHROME_INTERSTITIAL_ERROR mid-pass (#878): the
      # server serves two Lighthouse runs and is unreachable for the third.
      # wrangler's own output goes to /tmp/wrangler.log and was never surfaced,
      # so diagnosing it needed a local reproduction instead of just reading the
      # failure. Dump it — and say whether the process and port are still alive,
      # which distinguishes "crashed" from "wedged" and points at different fixes.
      - name: Wrangler diagnostics on failure
        if: failure()
        working-directory: .
        run: |
            # Dump log text WITHOUT letting the runner parse it as workflow
            # commands. A dumped line starting `::endgroup::` would close our
            # group early and strand the rest of the diagnostics inside no
            # group; `::error::` would forge an annotation. The `sed` indent
            # further down is cosmetic and cannot be relied on as protection.
            # The token must be unguessable from the log's own contents, so it
            # is generated per call rather than fixed.
            dump() {
              local tok
              tok="stop-$(date +%s%N)-${RANDOM}${RANDOM}"
              echo "::stop-commands::${tok}"
              cat
              echo "::${tok}::"
            }
            echo "::group::wrangler.log"
            if [ -f /tmp/wrangler.log ]; then tail -200 /tmp/wrangler.log | dump; else echo "(no /tmp/wrangler.log)"; fi
            echo "::endgroup::"
            echo "::group::wrangler internal log"
            # When wrangler aborts (#878) it prints an [ERROR] with an EMPTY
            # body to stdout, then names a log file it wrote the real detail
            # to. Run 32295262333 captured exactly that: the banner, the
            # "please file a bug" link, ~9 more successful requests, and then
            # the process gone -- with the one field that explains it blank.
            # /tmp/wrangler.log above is only our stdout redirect, so it has
            # the same blank. This is the file that does not.
            log=$(find "$HOME/.config/.wrangler/logs" -maxdepth 1 -name '*.log' \
                    -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "$log" ]; then
              echo "  file: $log"
              # Both pipelines are best-effort: the step runs under `bash -e`,
              # and a diagnostic that aborts the step would take the liveness
              # and resource probes with it -- losing the evidence it exists to
              # collect, on the one run where it matters.
              tail -200 "$log" 2>/dev/null | sed 's/^/  /' | dump || true
            else
              echo "  (no log under $HOME/.config/.wrangler/logs)"
            fi
            echo "::endgroup::"
            echo "::group::server liveness"
            echo "listeners on :8788:"
            # Capture, then decide. `ss` exits 0 with EMPTY output when nothing
            # is listening, so an `|| echo none` chain prints nothing at all --
            # and "no listener" is precisely the crashed-vs-wedged signal this
            # step exists to report. Silence would be the wrong answer here.
            # -H suppresses ss's header. Without it a no-listener result is a
            # header row with zero entries -- non-empty, so it printed as though
            # something WAS listening. Observed in run 32266757116.
            # netstat's grep is field-bounded so ':8788' cannot match ':87880'.
            listeners=$( { command -v ss >/dev/null && ss -H -lptn 'sport = :8788'; } 2>/dev/null \
              || netstat -lptn 2>/dev/null \
                | grep -E '(^|[[:space:]])[^[:space:]]*:8788([[:space:]]|$)' || true )
            if [ -n "$listeners" ]; then printf '%s\n' "$listeners"; else echo "  none"; fi
            echo "wrangler/workerd processes:"
            pgrep -a -f 'wrangler|workerd' || echo "  none running"
            echo "HTTP probe:"
            # Bounded deliberately: the case this step exists to catch is a
            # server that accepts the connection and never answers. An unbounded
            # probe would hang there until the 15-minute job timeout and could
            # cost the artifact upload -- the diagnostic making the failure worse.
            curl --connect-timeout 2 --max-time 5 -sS -o /dev/null \
              -w '  status=%{http_code} time=%{time_total}s\n' http://localhost:8788/ || echo "  no response within 5s"
            echo "::endgroup::"
            # Three occurrences of #878 have now shown the same shape -- two clean
            # Lighthouse runs, then a silent abort mid-asset-serving on the third,
            # process gone and the port refused in ~0.2ms. That is an abort, not a
            # hang, but the two candidate causes (kernel OOM kill vs a workerd
            # crash) are indistinguishable from what this step captures today.
            # These probes are what tells them apart. wrangler 4.124.0 did NOT
            # fix it, so the version hypothesis is spent.
            echo "::group::resources"
            echo "memory:"
            # Capture, then decide -- `free | sed || echo` takes the PIPELINE's
            # status, which is sed's success, so the fallback never fires and the
            # section prints nothing at all. Same trap as the listener check above.
            mem=$(free -m 2>/dev/null || true)
            if [ -n "$mem" ]; then printf '%s\n' "$mem" | sed 's/^/  /'; else echo "  (free unavailable)"; fi
            echo "load average:"
            # Capture before deciding, as every probe in this block does: `sed`
            # exits 0 on a file that exists but is EMPTY, so a `|| echo` fallback
            # would never fire and the section would print blank -- the one output
            # a diagnostic must never produce.
            load=$(sed 's/^/  /' /proc/loadavg 2>/dev/null || true)
            if [ -n "$load" ]; then printf '%s\n' "$load"; else echo "  (unavailable)"; fi
            echo "kernel OOM kills (the question three runs have failed to answer):"
            # dmesg is often restricted to root on hosted runners; sudo -n so a
            # missing grant fails immediately instead of prompting and hanging.
            oom=$( { sudo -n dmesg 2>/dev/null || dmesg 2>/dev/null; } \
              | grep -iE 'out of memory|oom[-_]kill|killed process' | tail -20 || true )
            if [ -n "$oom" ]; then printf '%s\n' "$oom" | sed 's/^/  /'; else echo "  none found (or dmesg not readable)"; fi
            echo "::endgroup::"

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci
          retention-days: 30
