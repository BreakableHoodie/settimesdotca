name: Playwright container image
description: >-
    Names the official Playwright image for the Playwright version pinned in
    the root package-lock.json, for a job's `container:` (#1391).

# Why: on hosted runners Playwright's system packages came from apt on every
# run, and a slow mirror failed jobs before any test ran (#1391). The image
# ships the browsers and their packages preinstalled. The tag is read from the
# lockfile, never typed into a workflow: Dependabot bumps Playwright in the
# lockfile but cannot bump a `container:` image, so a hand-pinned tag would
# drift from the browsers the tests expect.
#
# Pinned by digest, from digests.json: these jobs hold deploy and push
# credentials, and a tag can be re-pushed. Every action in this repo is pinned
# to a SHA for the same reason. A Playwright bump needs one reviewed line
# there; until it lands, the job fails closed and prints the command.

outputs:
    image:
        description: The image reference, e.g. mcr.microsoft.com/playwright:v1.64.1-noble@sha256:...
        value: ${{ steps.image.outputs.image }}

runs:
    using: composite
    steps:
        - name: Read the Playwright version from the lockfile
          id: image
          shell: bash
          # playwright-core decides which browser builds a run needs.
          run: |
              version=$(node -e '
                  const pkgs = require(process.argv[1]).packages ?? {};
                  process.stdout.write(pkgs["node_modules/playwright-core"]?.version ?? "");
              ' "$GITHUB_WORKSPACE/package-lock.json")
              # Fail closed: an empty or odd value would name an image that
              # does not exist, and the job would fail later with a pull error.
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "✗ No playwright-core version in package-lock.json (got '$version')." >&2
                  exit 1
              fi
              tag="mcr.microsoft.com/playwright:v$version-noble"
              digest=$(node -e '
                  const map = require(process.argv[1]);
                  process.stdout.write(Object.hasOwn(map, process.argv[2]) ? map[process.argv[2]] : "");
              ' "$GITHUB_ACTION_PATH/digests.json" "$version")
              if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "✗ No digest for Playwright $version in .github/actions/playwright-image/digests.json." >&2
                  echo "  Add the image index digest (Docker-Content-Digest) from:" >&2
                  echo "  curl -sSI -H 'Accept: application/vnd.oci.image.index.v1+json' https://mcr.microsoft.com/v2/playwright/manifests/v$version-noble" >&2
                  exit 1
              fi
              echo "image=$tag@$digest" >> "$GITHUB_OUTPUT"
              echo "Playwright image: $tag@$digest"
