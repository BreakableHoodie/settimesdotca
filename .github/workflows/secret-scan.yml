name: Secret Scanning

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly full-history scan on Monday at 6 AM UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detect Secrets (gitleaks)
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan all commits, not just HEAD
          fetch-depth: 0
          persist-credentials: false

      # The CLI, not gitleaks/gitleaks-action. The action (v3.0.0) listed a
      # PR's commits from ONE page of the GitHub API (30 by default) and
      # scanned only through the last commit on it, so a secret added in
      # commit 31+ left this required check green (#1202). The CLI scans an
      # explicit git range, which is correct by construction.
      #
      # Replacing an action with a downloaded binary must not weaken the
      # supply chain: the version is pinned and the tarball is checked against
      # the SHA-256 in the release's own checksums.txt before it runs.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -eu
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          range=""
          case "$EVENT" in
            pull_request)
              # Every commit the PR adds, however many.
              range="$(git merge-base "$PR_BASE" "$PR_HEAD")..$PR_HEAD"
              ;;
            push)
              # A new branch (all-zero `before`) or an unreachable `before`
              # falls back to scanning full history rather than nothing.
              if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
          esac
          # `git log -p` prints no patch for a merge commit, so a secret added
          # while resolving a conflict was invisible to both paths (reproduced).
          # `remerge` diffs each merge against git's own automatic merge, so it
          # shows exactly what the resolution changed and does not re-scan the
          # merged-in branch under a new fingerprint. Custom --log-opts replace
          # gitleaks' defaults, hence --all --full-history on the full scan.
          echo "Scanning: ${range:-full history}"
          if [ -n "$range" ]; then
            gitleaks git --redact --no-banner --exit-code 1 --log-opts="--diff-merges=remerge $range"
          else
            gitleaks git --redact --no-banner --exit-code 1 --log-opts="--all --full-history --diff-merges=remerge"
          fi
