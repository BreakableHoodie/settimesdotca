name: E2E Tests

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    # dorny/paths-filter resolves the changed-file list by calling the PR files
    # API. A public repo's restricted GITHUB_TOKEN can read that anyway; a private
    # repo's cannot, and the step fails with "Resource not accessible by
    # integration" in ~8s — which reads like a broken test run, not a permission
    # gap. Surfaced the day this repo went private (2026-09-16).
    pull-requests: read

jobs:
    # Names the Playwright image for the lockfile's version (#1391). A job
    # output, because a `container:` image cannot be read from a file.
    playwright-image:
        name: Playwright image
        runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
        timeout-minutes: 5
        outputs:
            image: ${{ steps.image.outputs.image }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false
                  sparse-checkout: |
                      package-lock.json
                      .github/actions/playwright-image
                  sparse-checkout-cone-mode: false
            - id: image
              uses: ./.github/actions/playwright-image

    e2e:
        name: e2e
        runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
        needs: playwright-image
        # Browsers and their system packages come preinstalled: no apt (#1391).
        # --ipc=host: Chromium runs out of shared memory in Docker's default 64 MB.
        container:
            image: ${{ needs.playwright-image.outputs.image }}
            options: --ipc=host
        timeout-minutes: 35
        # Fork PRs cannot access repo secrets; credentials.js throws when ADMIN_PASSWORD is unset.
        # Skip the job for fork PRs — it still runs on push and same-repo PRs.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false

            # PR-only. On a push every step below runs regardless (each `if:`
            # starts with `github.event_name == 'push' ||`), so the filter's
            # output is unused there -- but it still tries to `git fetch` the
            # push's `before` commit, which this shallow, credential-less
            # checkout cannot do on a private repo ("could not read Username").
            # Every push to main failed E2E that way from 2026-09-16 until this
            # guard; cloudflare-pages.yml's filter carries the same one.
            - name: Run affected tests (fast-path)
              id: affected
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
              with:
                  filters: |
                      frontend: 'frontend/**'
                      e2e: 'e2e/**'
                      functions: 'functions/**'
                      # Multi-pattern filters must be YAML lists. A `|` block is
                      # ONE pattern with newlines in it and never matches: from
                      # #457 to #1391 a schema- or CI-only PR skipped this suite.
                      schema:
                          - 'migrations/**'
                          - 'database/**'
                      ci:
                          - '.github/actions/e2e-env/**'
                          - '.github/actions/apt-deb-cache/**'
                          - '.github/actions/playwright-image/**'
                          - '.github/workflows/e2e-tests.yml'
                      # Playwright is pinned in the root lockfile, and dependencies
                      # change what is built (#1379's class, for this suite).
                      deps:
                          - 'package.json'
                          - 'package-lock.json'
                          - 'frontend/package.json'
                          - 'frontend/package-lock.json'
                          - 'playwright.config.js'

            - name: E2E environment
              if: github.event_name == 'push' || steps.affected.outputs['frontend'] == 'true' || steps.affected.outputs['e2e'] == 'true' || steps.affected.outputs['functions'] == 'true' || steps.affected.outputs['schema'] == 'true' || steps.affected.outputs['ci'] == 'true' || steps.affected.outputs['deps'] == 'true'
              uses: ./.github/actions/e2e-env
              with:
                  e2e-admin-password: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  e2e-admin-email: ${{ secrets.E2E_ADMIN_EMAIL }}

            - name: Run Playwright tests
              if: github.event_name == 'push' || steps.affected.outputs['frontend'] == 'true' || steps.affected.outputs['e2e'] == 'true' || steps.affected.outputs['functions'] == 'true' || steps.affected.outputs['schema'] == 'true' || steps.affected.outputs['ci'] == 'true' || steps.affected.outputs['deps'] == 'true'
              env:
                  ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
                  PLAYWRIGHT_SKIP_A11Y_VISUAL: 'true'
              run: npx playwright test --reporter=list,html

            # The server's own log, not the tests'. On 2026-09-09 fifty specs
            # failed with ERR_CONNECTION_REFUSED after the boot loop had
            # already reported "Server is ready" and the setup project had
            # passed -- so wrangler started, served, then stopped. The
            # Playwright report records fifty identical connection errors and
            # nothing about WHY the server went away, because /tmp/wrangler.log
            # was never collected. A red build with no diagnostic is the same
            # family as a green one that did not look.
            #
            # if-no-files-found: warn -- the log is absent when the
            # affected-paths filter skips the environment step entirely, which
            # is a legitimate no-op rather than a failure.
            - name: Upload wrangler server log
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: wrangler-log-e2e
                  path: /tmp/wrangler.log
                  if-no-files-found: warn
                  retention-days: 30

            # Playwright writes typed values (the admin password) into snapshots,
            # traces and the HTML report, and this repo is public. Upload only scrubbed
            # test-results, and only when the scrub itself succeeded: failure() alone is
            # still true after a failed scrub step. See scripts/scrub-e2e-artifacts.mjs.
            - name: Scrub Playwright artifacts
              id: scrub
              if: failure()
              env:
                  SCRUB_SECRETS: ${{ secrets.E2E_ADMIN_PASSWORD }}
              run: node scripts/scrub-e2e-artifacts.mjs test-results playwright-report

            - name: Upload Playwright failure artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure() && steps.scrub.outcome == 'success'
              with:
                  name: playwright-failures-e2e
                  path: test-results/
                  if-no-files-found: ignore
                  retention-days: 7
