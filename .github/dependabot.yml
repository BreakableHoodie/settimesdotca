version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Wait 7 days before proposing a newly published version -- same
    # rationale as min-release-age in .npmrc.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
    groups:
      root-npm-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    # Wait 7 days before proposing a newly published version -- same
    # rationale as min-release-age in .npmrc.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
    groups:
      frontend-npm-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Wait 7 days before proposing a newly published version -- same
    # rationale as min-release-age in .npmrc.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-all:
        patterns:
          - "*"
