# Sponsorship for settimes.ca — the Waterloo Region live-music platform.
#
# Sponsorship supports what it costs to keep the platform running and open:
# the domain, Cloudflare Pages/D1/R2, transactional email, and the time to
# keep the lineups accurate during a show.
#
# GitHub renders a "Sponsor" button on the repo from this file. Each key is a
# platform; the value is a username or URL on that platform. Several may be
# listed at once.

# Both platforms are listed on purpose. GitHub renders ONE Sponsor button that
# offers the reader a choice, so this is not two competing asks.
#
# github takes no platform fee and is the better destination for anyone already
# signed in to GitHub. ko_fi needs no account at all, which matters because most
# people supporting this are fans of the shows rather than developers — and it is
# the one the site's own footer links to.
#
# Enrollment completed 2026-09-03. The tell that it is live: /sponsors/<user>
# returns 200 and STAYS on that URL. While unenrolled it returned 200 and
# redirected to the profile, which is why this line sat commented until now — a
# Sponsor button that lands on a profile page is worse than no button.
github: BreakableHoodie
ko_fi: tiptophams

# Other options, none of them set up:
#
# buy_me_a_coffee: <handle>  # like ko-fi, ~5% platform fee
# liberapay: <handle>        # recurring only, non-profit, very low fees
# open_collective: <slug>    # public ledger; fiscal-host fee applies
# custom: ["https://settimes.ca/support"]   # up to 4 URLs
