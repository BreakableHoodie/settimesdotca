# Cloudflare Pages Configuration for SetTimes.ca
#
# This configuration is used for:
# - Local development with Wrangler
# - D1 database bindings
# - Environment variables (secrets set via Cloudflare dashboard)

name = "settimesdotca"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "frontend/dist"

# Note: Cloudflare Pages ignores wrangler [build] configs and expects the final
# artifacts to be present in pages_build_output_dir. The GitHub Actions workflow
# handles installing dependencies and running `npm run build` before deploying.

# D1 Database Binding
#
# The database will be available in Pages Functions as `env.DB`
#
# Setup instructions:
# 1. Create the database: wrangler d1 create settimes-db
# 2. Note the database_id from the output
# 3. Update the database_id below
# 4. Initialize schema: wrangler d1 execute settimes-db --file=database/schema.sql
# 5. Add sample data: wrangler d1 execute settimes-db --file=database/seed.sql

[[d1_databases]]
binding = "DB"
database_name = "settimes-production-db"
database_id = "c6c8b4a6-f951-47c1-a787-aab0a61ca09b" # binding reference only — not a credential; D1 access still requires Cloudflare API token auth

# Analytics Engine binding (privacy-first metrics) — secondary, queryable sink
# read by functions/api/metrics.js (env.ANALYTICS.writeDataPoint). The D1 daily
# aggregate tables remain the primary store; this adds fast, queryable analytics
# for the event-day dashboard. The metrics handler guards on `if (env.ANALYTICS)`,
# so this is a no-op until the binding resolves.
#
# Production (Pages): also add the binding in the Cloudflare dashboard under
# Settings > Functions > Analytics Engine bindings (Variable name: ANALYTICS),
# mirroring the R2 binding below. Requires Analytics Engine enabled on the account.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "settimes_metrics"

# Cron triggers are not supported for Cloudflare Pages.
# Scheduled tasks (popularity aggregation, PII retention cleanup, share-link
# expiry) run via .github/workflows/scheduled-jobs.yml, which POSTs daily to
# /api/internal/run-scheduled. That endpoint is gated by the CRON_SECRET env
# var — configure it in Cloudflare Pages Settings → Environment Variables and
# as a GitHub Actions repository secret with the same value.

# For local development, Wrangler will create a local SQLite database
# Local DB path: .wrangler/state/v3/d1/miniflare-D1DatabaseObject/

# Environment Variables
#
# These should be set in Cloudflare Pages dashboard under Settings > Environment Variables
#
# Required variables:
# - ENVIRONMENT: production or development
# - PUBLIC_URL: Base URL used in email links (for example https://settimes.ca)
# - PUBLIC_DATA_PUBLISH_ENABLED: Set "true" to publish public event data (unset or false keeps public endpoints disabled)
# - CSRF_SECRET: Required in production
# - MFA_TOTP_ENCRYPTION_KEY: Required before any TOTP MFA flow; set it in local .dev.vars too when testing MFA locally
# - CSP_ENFORCE: Set "true" to enforce CSP (report-only when false/omitted)
# - EMAIL_PROVIDER: "postmark", "mailchannels", or "resend"
# - EMAIL_FROM: Sender address for transactional email
# - ADMIN_EMAIL: Optional fallback sender if EMAIL_FROM is not set
# - POSTMARK_API_TOKEN: Required when EMAIL_PROVIDER="postmark"
# - RESEND_API_KEY: Required when EMAIL_PROVIDER="resend"
# - CORS_ALLOWED_ORIGINS: Optional comma-separated extra allowed origins
# - ALLOW_HEADER_AUTH: Non-production only, for trusted automation
# - LOG_LEVEL: debug, info, warn, or error
# - SCHEDULE_CACHE_TTL_SECONDS: Optional cache TTL override for public schedule responses
#
# For local development, create a .dev.vars file (NOT committed to git):
#
# ENVIRONMENT=development
# PUBLIC_URL=http://localhost:8788
# PUBLIC_DATA_PUBLISH_ENABLED=false
# BAND_PHOTOS_PUBLIC_URL=https://band-photos.settimes.ca  # public base URL serving uploaded band photos (R2 public bucket / custom domain); falls back to the prod domain if unset

# R2 Bucket Binding
#
# The R2 bucket will be available in Pages Functions as `env.BAND_PHOTOS`
#
# Setup instructions:
# 1. Create the bucket: wrangler r2 bucket create settimes-band-photos
# 2. Bind to Pages project in Cloudflare dashboard:
#    Settings > Functions > R2 bucket bindings > Add binding
#    Variable name: BAND_PHOTOS
#    R2 bucket: settimes-band-photos

[[r2_buckets]]
binding = "BAND_PHOTOS"
bucket_name = "settimes-band-photos"

# Custom routes (optional - Pages handles this automatically)
# Uncomment if you need custom routing behavior
# [[routes]]
# pattern = "/api/*"
# custom_domain = false
