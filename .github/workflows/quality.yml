name: Quality Checks

on:
  pull_request:
    branches: [main, dev]
    # Skip docs-only PRs — but docs/api-spec.yaml is the OpenAPI contract this
    # workflow's "OpenAPI Validation" job exists to check, so re-include it.
    # (paths patterns evaluate in order; the last matching pattern decides.)
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/api-spec.yaml"

permissions:
  contents: read

# These checks only run on PRs and focus on fast quality gates,
# including early OpenAPI drift detection before merge.

env:
  NODE_VERSION: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Validate OpenAPI spec
        run: npm run validate:openapi

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

  format-check-backend:
    name: Format Check (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check backend code formatting
        run: npm run format:check

  lint-backend:
    name: ESLint (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check setup-complete.sql matches migrations
        run: node scripts/check-schema-drift.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Backend coverage
        run: npm run test:coverage

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend coverage
        working-directory: frontend
        run: npm run test:coverage

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: npm run test:a11y

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify Chrome installed
        working-directory: .
        run: google-chrome --version

      - name: Prepare E2E environment
        uses: ./.github/actions/e2e-env
        with:
          install-playwright: 'false'
          # Lighthouse only loads public pages and never authenticates, so this
          # job is deliberately not handed admin credentials.
          seed-admin: 'false'

      - name: Run Lighthouse CI
        working-directory: frontend
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CI: true

      # The gate has failed with CHROME_INTERSTITIAL_ERROR mid-pass (#878): the
      # server serves two Lighthouse runs and is unreachable for the third.
      # wrangler's own output goes to /tmp/wrangler.log and was never surfaced,
      # so diagnosing it needed a local reproduction instead of just reading the
      # failure. Dump it — and say whether the process and port are still alive,
      # which distinguishes "crashed" from "wedged" and points at different fixes.
      - name: Wrangler diagnostics on failure
        if: failure()
        working-directory: .
        run: |
            echo "::group::wrangler.log"
            if [ -f /tmp/wrangler.log ]; then tail -200 /tmp/wrangler.log; else echo "(no /tmp/wrangler.log)"; fi
            echo "::endgroup::"
            echo "::group::server liveness"
            echo "listeners on :8788:"
            (command -v ss >/dev/null && ss -lptn 'sport = :8788') || netstat -lptn 2>/dev/null | grep ':8788' || echo "  none"
            echo "wrangler/workerd processes:"
            pgrep -a -f 'wrangler|workerd' || echo "  none running"
            echo "HTTP probe:"
            curl -sS -o /dev/null -w '  status=%{http_code} time=%{time_total}s\n' http://localhost:8788/ || echo "  unreachable"
            echo "::endgroup::"

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci
          retention-days: 30
