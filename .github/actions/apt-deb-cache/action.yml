name: apt package cache for Playwright
description: >-
    Keeps the .deb files that `playwright install --with-deps` / `install-deps`
    download, so apt installs them from the cache instead of a mirror (#1391).
    Call it twice: `mode: restore` before the install, `mode: save` after it,
    passing the restore step's `key` and `cache-hit` outputs.

# Why: the Chromium binary was already cached, but its system packages (fonts
# and libraries, ~26 MB) came from azure.archive.ubuntu.com on every run. On
# 2026-10-26 that mirror slowed to minutes per package for hours, and every
# Playwright job hit its 300s install bound before a single test ran. Cached
# .debs are the identical packages the mirror serves, so screenshot baselines
# cannot drift the way a different base image could make them.

inputs:
    mode:
        description: "'restore' (before the install) or 'save' (after it)"
        required: true
    key:
        description: "save only: the restore step's key output"
        required: false
        default: ''
    cache-hit:
        description: "save only: the restore step's cache-hit output"
        required: false
        default: ''

outputs:
    key:
        description: The cache key, for the save call
        value: ${{ steps.key.outputs.key }}
    cache-hit:
        description: "'true' when the exact key was restored"
        value: ${{ steps.restore.outputs.cache-hit }}

runs:
    using: composite
    steps:
        - name: Compute the apt cache key
          id: key
          if: inputs.mode == 'restore'
          shell: bash
          # ImageOS (ubuntu24) is a runner env var, not in the env context. The
          # root lockfile pins Playwright, which decides the package list.
          run: echo "key=apt-debs-${ImageOS:-unknown}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

        - name: Restore cached apt packages
          id: restore
          if: inputs.mode == 'restore'
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.cache/apt-debs
              key: ${{ steps.key.outputs.key }}
              restore-keys: |
                  apt-debs-

        - name: Point apt at the cache, off the Azure mirror
          if: inputs.mode == 'restore'
          shell: bash
          run: |
              dir="$HOME/.cache/apt-debs"
              sudo mkdir -p "$dir/partial"
              # apt-get keeps what it downloads by default; the explicit setting
              # also covers the `apt` front end. An absolute Dir::Cache::Archives
              # escapes any DPkg::Post-Invoke hook that cleans the default path.
              printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' "$dir" \
                  | sudo tee /etc/apt/apt.conf.d/99-apt-deb-cache >/dev/null
              echo "Restored $(find "$dir" -maxdepth 1 -name '*.deb' | wc -l) cached .deb files."
              # Prefer the canonical archive: the slow host was the Azure mirror.
              # Only drop Azure when another archive entry remains, so apt is
              # never left with no mirror at all.
              list=/etc/apt/apt-mirrors.txt
              if [ -f "$list" ] && grep -v 'azure\.archive\.ubuntu\.com' "$list" | grep -q 'archive\.ubuntu\.com'; then
                  sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$list"
              fi
              [ -f "$list" ] && { echo "apt mirrors:"; cat "$list"; } || true

        - name: Make the cached packages readable for saving
          if: inputs.mode == 'save' && inputs.cache-hit != 'true'
          shell: bash
          # apt writes as root and keeps partial/ at mode 700; tar runs as the
          # runner user and would fail on it.
          run: |
              dir="$HOME/.cache/apt-debs"
              sudo rm -rf "$dir/partial" "$dir/lock"
              sudo chown -R "$(id -u):$(id -g)" "$dir"
              echo "Saving $(find "$dir" -maxdepth 1 -name '*.deb' | wc -l) .deb files."

        - name: Save apt packages
          if: inputs.mode == 'save' && inputs.cache-hit != 'true'
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.cache/apt-debs
              key: ${{ inputs.key }}
