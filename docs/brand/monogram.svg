<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- SetTimes "ST" monogram — accent orange "S" + white "T" on midnight-ember navy.
       Canonical source; frontend/public/favicon.svg and the generated favicon/PWA
       PNGs are rendered from this exact design. Regenerate them together if this changes. -->
  <rect width="64" height="64" fill="#0c0f1a" rx="12"/>

  <!-- "S" in accent orange -->
  <text
    x="7"
    y="47"
    font-family="'Arial Black', Arial, 'Helvetica Neue', sans-serif"
    font-size="40"
    font-weight="900"
    letter-spacing="-2.5"
    fill="#f97316"
  >S</text>

  <!-- "T" in white -->
  <text
    x="31"
    y="47"
    font-family="'Arial Black', Arial, 'Helvetica Neue', sans-serif"
    font-size="40"
    font-weight="900"
    letter-spacing="-2.5"
    fill="#ffffff"
  >T</text>
</svg>
