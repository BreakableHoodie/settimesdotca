  /api/admin/analytics/subscriptions:
    get:
      tags:
        - Admin - Analytics
      summary: Get aggregate subscription analytics
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Subscription analytics response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAnalyticsResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/maintenance/cleanup-sessions:
    post:
      tags:
        - Admin - Maintenance
      summary: Run the retention cleanup job
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: Cleanup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupSessionsResponse"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session_token
      description: Deployed admin session cookie. Local Pages development uses `session_token`.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Echo the `csrf_token` cookie for authenticated POST, PUT, PATCH, and DELETE admin requests.

  parameters:
    NumericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication failed or no active session exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Request was blocked by RBAC, CSRF validation, or same-origin validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource state conflicts with the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PublicDataUnavailable:
      description: Public publishing is disabled for this route
      headers:
        Retry-After:
          schema:
            type: string
            example: "3600"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected server or database error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

