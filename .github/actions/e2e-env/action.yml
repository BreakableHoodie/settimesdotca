name: E2E environment
description: Installs dependencies, builds the frontend, initializes local D1, and starts wrangler pages dev on :8788.

inputs:
    e2e-admin-password:
        description: Admin password to seed for E2E login
        required: false
        default: ''
    e2e-admin-email:
        description: Admin email to seed
        required: false
        default: ''
    install-playwright:
        description: Whether to install Playwright browsers
        required: false
        default: 'true'
    seed-admin:
        description: >
            Whether this consumer needs an admin account seeded. 'true' (the
            default) requires e2e-admin-email/password and FAILS the job if
            either is empty, so a misconfigured secret surfaces immediately
            instead of silently producing a DB with no admin. Set to 'false'
            for jobs that only exercise public pages and must not be handed
            admin credentials (least privilege).
        required: false
        default: 'true'

runs:
    using: composite
    steps:
        # Runs first, before anything it guards. Both inputs are compared as
        # strings elsewhere, so any typo ('ture') would silently take the
        # false branch — skipping the admin seed AND its credential check,
        # which is the exact fail-open this guard exists to close.
        - name: Validate action inputs
          shell: bash
          env:
              INSTALL_PLAYWRIGHT: ${{ inputs.install-playwright }}
              SEED_ADMIN: ${{ inputs.seed-admin }}
          run: |
              case "$INSTALL_PLAYWRIGHT" in
                  true|false) ;;
                  *) echo "✗ install-playwright must be 'true' or 'false' (got '$INSTALL_PLAYWRIGHT')." >&2; exit 1 ;;
              esac
              case "$SEED_ADMIN" in
                  true|false) ;;
                  *) echo "✗ seed-admin must be 'true' or 'false' (got '$SEED_ADMIN')." >&2; exit 1 ;;
              esac

        - name: Setup Node
          uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
          with:
              node-version: 22
              cache: npm
              cache-dependency-path: |
                  package-lock.json
                  frontend/package-lock.json

        - name: Install dependencies
          shell: bash
          run: npm ci

        - name: Install frontend dependencies
          shell: bash
          working-directory: frontend
          run: npm ci

        - name: Cache Playwright browsers
          if: inputs.install-playwright == 'true'
          id: playwright-cache
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.cache/ms-playwright
              key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
              restore-keys: |
                  playwright-${{ runner.os }}-

        - name: Install Playwright browsers
          if: inputs.install-playwright == 'true'
          shell: bash
          env:
              CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
          run: |
              # Bounded because `install-deps` shells out to apt-get, which can
              # block indefinitely on a dpkg lock or an unreachable mirror. On
              # 2026-08-19 it hung 34m47s and consumed the job's entire 35-minute
              # budget, leaving a step boundary as the only clue (#881). The boot
              # loop below already learned this lesson in #625; this step had not.
              #
              # A timeout turns a 35-minute silent stall into a fast, obviously
              # retryable failure. Exit 124 is timeout(1)'s signal, called out so
              # the next reader does not have to look it up.
              # Retry is gated on apt recovery (#883). `timeout` kills only the
              # process it launched -- the `npx playwright install-deps` wrapper --
              # while the apt-get it re-exec'd as root survives, holding
              # /var/lib/apt/lists/lock. A naive retry therefore died in ~2s with
              # "Could not get lock ... held by process N", turning a clear 124 into
              # a confusing exit 1. The orphan must be killed and the locks cleared
              # before re-attempting.
              #
              # Safe because hosted runners are single-use VMs: this only runs after
              # the bound has already fired, and the state it touches is discarded
              # with the job. Do NOT copy this anywhere long-lived.
              # Returns 0 only if apt is genuinely usable again. The caller must
              # NOT retry on a non-zero return: a retry into a still-locked apt
              # burns another 300s and reports a confusing exit 1 instead of the
              # clear timeout -- which is why the first attempt at this was reverted.
              # Returns 0 only if apt is genuinely usable again. The caller must
              # NOT retry on a non-zero return: a retry into a still-locked apt
              # burns another 300s and reports a confusing exit 1 instead of the
              # clear timeout -- which is why the first attempt at this was reverted.
              APT_LOCKS="/var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend"

              apt_recover() {
                  echo "  recovering apt state (killing orphaned apt/dpkg)" >&2
                  local SUDO=""
                  [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo -n"

                  # Kill the holders. Deliberately NOT `rm` the lock files: unlinking
                  # a lock does not release it, and a retry would then create a FRESH
                  # lock and run apt concurrently with the surviving holder, which is
                  # how dpkg state actually gets corrupted. Killing the holder
                  # releases its fcntl lock; that is the whole job.
                  $SUDO pkill -9 -x apt-get 2>/dev/null || true
                  $SUDO pkill -9 -x dpkg 2>/dev/null || true
                  # fuser catches holders pgrep's exact-name match misses (apt,
                  # unattended-upgrades, dpkg-deb ...). Absent on some images, so it
                  # is best-effort here and only authoritative in the check below.
                  if command -v fuser >/dev/null 2>&1; then
                      # shellcheck disable=SC2086
                      $SUDO fuser -k -9 $APT_LOCKS >/dev/null 2>&1 || true
                  fi
                  sleep 2

                  # Repair a transaction interrupted by the kill. Unlike the kills,
                  # this must SUCCEED -- a half-configured dpkg fails every later
                  # install, so retrying on top of it is worse than not retrying.
                  if ! $SUDO dpkg --configure -a >/dev/null 2>&1; then
                      echo "  recovery FAILED: dpkg --configure -a could not repair state" >&2
                      return 1
                  fi

                  # VERIFY, rather than assume. Every kill above is `|| true`, so a
                  # missing sudo grant or an unmatched holder would otherwise pass
                  # silently and doom the retry before it started.
                  if command -v fuser >/dev/null 2>&1; then
                      # shellcheck disable=SC2086
                      if $SUDO fuser -s $APT_LOCKS 2>/dev/null; then
                          echo "  recovery FAILED: an apt lock still has a holder — not retrying" >&2
                          return 1
                      fi
                  elif pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1; then
                      echo "  recovery FAILED: apt-get/dpkg still running — not retrying" >&2
                      return 1
                  fi
                  echo "  recovery ok: no holder on the apt locks" >&2
                  return 0
              }

              # Returns 0, or the command's exit code. Prints why. Sets
              # BOUNDED_TIMED_OUT=1 when the bound fired, so the caller can retry a
              # timeout without re-deriving that from the exit code.
              run_bounded_once() {
                  local label="$1"
                  shift
                  # Assign from the failing command directly. The original bug here
                  # was `if timeout ...; then return 0; fi` followed by `code=$?`:
                  # an `if` whose condition FAILS and has no else returns 0, so $?
                  # was the if-statement's status, not the command's -- every failure
                  # captured as 0 and silently treated as success.
                  #
                  # NOTE: `local` is not the culprit, contrary to what this comment
                  # previously said. `false; local code=$?` correctly yields 1; the
                  # form that does mask is `local code=$(cmd)`. Verified 2026-08-19.
                  local code=0
                  # -k: `timeout` sends SIGTERM, which apt-get mid-dpkg can ignore
                  # or block on -- leaving the process alive and the step still
                  # hung, i.e. failing in exactly the case this bound exists for.
                  # SIGKILL follows 30s later and cannot be ignored.
                  local started=$SECONDS
                  timeout -k 30s 300s "$@" || code=$?
                  local elapsed=$(( SECONDS - started ))
                  [ "$code" -eq 0 ] && return 0
                  # 124 = killed by SIGTERM at the deadline; 137 = 128+9, killed by
                  # the SIGKILL that -k sends when SIGTERM was ignored. Both mean the
                  # bound fired -- but `timeout` also passes THROUGH a wrapped command
                  # that exits 124 or 137 on its own, so the code alone cannot tell the
                  # two apart. Require the elapsed time to corroborate it, or a genuine
                  # apt failure returning 124 would be blamed on a hang it never had.
                  BOUNDED_TIMED_OUT=0
                  if { [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; } && [ "$elapsed" -ge 300 ]; then
                      BOUNDED_TIMED_OUT=1
                      echo "✗ $label exceeded 300s and was killed — usually apt-get" >&2
                      echo "  blocked on a lock or a slow mirror." >&2
                  else
                      echo "✗ $label failed with exit $code" >&2
                  fi
                  return "$code"
              }

              # One retry, and ONLY for a timeout. An ordinary failure (bad package,
              # no network) reproduces identically and would burn another 300s for
              # nothing.
              run_bounded() {
                  local label="$1"
                  shift
                  local code=0
                  run_bounded_once "$label" "$@" || code=$?
                  [ "$code" -eq 0 ] && return 0
                  # Retry ONLY when the bound fired AND recovery verified itself.
                  if [ "${BOUNDED_TIMED_OUT:-0}" -eq 1 ] && apt_recover; then
                      echo "  retrying once after recovery…" >&2
                      code=0
                      run_bounded_once "$label (retry)" "$@" || code=$?
                  fi
                  return "$code"
              }

              if [ "$CACHE_HIT" = "true" ]; then
                  run_bounded "playwright install-deps chromium" npx playwright install-deps chromium
                  run_bounded "playwright install chromium" npx playwright install chromium
              else
                  run_bounded "playwright install chromium --with-deps" npx playwright install chromium --with-deps
              fi

        - name: Build frontend
          shell: bash
          working-directory: frontend
          run: npm run build

        - name: Initialize D1 database with schema
          shell: bash
          run: |
              printf 'CSRF_SECRET="e2e-test-csrf-secret-for-ci"\nPUBLIC_DATA_PUBLISH_ENABLED="true"\nENVIRONMENT="development"\n' > .dev.vars

              echo "Initializing D1 database with schema..."
              ./frontend/node_modules/.bin/wrangler d1 execute settimes-production-db --local --persist-to .wrangler/state --file=database/setup-complete.sql

              echo "Seeding test data (venues, events, bands)..."
              ./frontend/node_modules/.bin/wrangler d1 execute settimes-production-db --local --persist-to .wrangler/state --file=database/seed-test-data.sql

              echo "✓ Schema and test data loaded"

        # Split out of the step above so the admin credentials are exposed ONLY
        # to the step that needs them: a public-only consumer (seed-admin:
        # 'false') never has them in its environment at all.
        - name: Seed E2E admin user
          if: inputs.seed-admin == 'true'
          shell: bash
          env:
              E2E_ADMIN_PASSWORD: ${{ inputs.e2e-admin-password }}
              E2E_ADMIN_EMAIL: ${{ inputs.e2e-admin-email }}
          run: |
              # Fail closed rather than proceeding with whatever the seed files
              # happen to contain: "we deliberately want no admin" and "the
              # secret is missing" used to be indistinguishable, and the second
              # only surfaced later as a confusing auth failure.
              if [ -z "$E2E_ADMIN_PASSWORD" ] || [ -z "$E2E_ADMIN_EMAIL" ]; then
                  echo "✗ seed-admin is 'true' but e2e-admin-email/e2e-admin-password are empty." >&2
                  echo "  Pass both secrets, or set seed-admin: 'false' for public-only jobs." >&2
                  exit 1
              fi
              echo "Creating E2E admin user..."
              SEED_SQL=$(node scripts/seed-e2e-admin.mjs --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD")
              ./frontend/node_modules/.bin/wrangler d1 execute settimes-production-db --local --persist-to .wrangler/state --command="$SEED_SQL"
              echo "✓ E2E admin user created: $E2E_ADMIN_EMAIL"

        - name: Report seeded database users
          shell: bash
          run: |
              echo "Database users:"
              ./frontend/node_modules/.bin/wrangler d1 execute settimes-production-db --local --persist-to .wrangler/state --command="SELECT id, email, role FROM users;"

              echo "✓ Database initialization complete"

        - name: Start Pages Functions server
          # Retries the SERVER BOOT ONLY, once, on a fresh process — never on test
          # failures (those are a separate step). A dead process or an unmet 180s
          # budget on attempt 1 kills any leftover wrangler/workerd/esbuild holding
          # :8788 and relaunches once before failing the job for real. See #625:
          # no observed CI failure has actually been a slow boot (worst seen was a
          # few seconds), so the budget is left at 180s rather than padded on
          # speculation — the retry covers one-off boot hiccups a longer wait
          # wouldn't fix anyway (e.g. a stuck port from a prior process).
          shell: bash
          run: |
              MAX_ITER=90    # 90 * 2s = 180s budget per attempt
              LOG_EVERY=10   # surface wrangler.log every 10 iterations (20s) instead of 40s

              start_wrangler() {
                  ./frontend/node_modules/.bin/wrangler pages dev frontend/dist --port 8788 --persist-to .wrangler/state > /tmp/wrangler.log 2>&1 &
                  WRANGLER_PID=$!
              }

              kill_wrangler() {
                  kill "$WRANGLER_PID" 2>/dev/null || true
                  # wrangler forks esbuild + workerd children that don't die with the
                  # parent; free the port explicitly so the retry doesn't fail to bind.
                  for pid in $(lsof -ti:8788 2>/dev/null); do
                      kill -9 "$pid" 2>/dev/null || true
                  done
              }

              wait_for_server() {
                  attempt=$1
                  echo "Waiting for server to start (attempt $attempt/2)..."
                  i=1
                  while [ $i -le $MAX_ITER ]; do
                      if ! kill -0 $WRANGLER_PID 2>/dev/null; then
                          echo "✗ Wrangler process exited unexpectedly (attempt $attempt)"
                          echo "Wrangler logs:"
                          cat /tmp/wrangler.log
                          return 1
                      fi
                      if curl -s http://localhost:8788/ > /dev/null 2>&1; then
                          echo "✓ Server is ready on port 8788! (attempt $attempt, $((i * 2))s)"
                          return 0
                      fi
                      if [ $((i % LOG_EVERY)) -eq 0 ]; then
                          echo "--- Wrangler log so far (attempt $attempt, iteration $i) ---"
                          tail -20 /tmp/wrangler.log 2>/dev/null
                          echo "---"
                      fi
                      echo "Waiting for server... ($i/$MAX_ITER, attempt $attempt)"
                      sleep 2
                      i=$((i + 1))
                  done
                  echo "✗ Server failed to start after $((MAX_ITER * 2)) seconds (attempt $attempt)"
                  echo "Wrangler logs:"
                  cat /tmp/wrangler.log
                  return 1
              }

              start_wrangler
              if wait_for_server 1; then
                  exit 0
              fi

              echo "Startup attempt 1 failed — killing any leftover process and retrying boot once..."
              kill_wrangler
              sleep 2

              start_wrangler
              if wait_for_server 2; then
                  exit 0
              fi

              echo "✗ Server failed to start after 2 attempts — genuine startup failure, not transient boot slowness"
              exit 1
