# Fixes #1209: Dependabot merges use GITHUB_TOKEN, so their pushes do not start
# push-triggered workflows. workflow_dispatch does work with that token, so this
# runs every 30 minutes and dispatches the production deploy for an unhandled
# main HEAD after a 10-minute grace period. It never retries a failed deploy.
name: Deploy Reconcile

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION: 22

concurrency:
  group: deploy-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile main deploy
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Reconcile deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/deploy-reconcile.mjs
