openapi: 3.0.3
info:
  title: SetTimes API
  version: "2026-02"
  description: |
    Live API contract for the current Cloudflare Pages + D1 implementation.

    Highlights:
    - Public schedule, discovery, band, feed, subscription, and telemetry endpoints
    - Invite-based admin signup with session cookies, CSRF protection, and optional TOTP MFA
    - Role-based admin routes for events, venues, bands, performers, users, invites, analytics, and maintenance
  contact:
    name: SetTimes
  license:
    name: AGPL-3.0-only

servers:
  - url: https://settimes.ca
    description: Production
  - url: http://localhost:8788
    description: Local Pages development

tags:
  - name: Public
    description: Public schedule, discovery, band, feed, and telemetry endpoints
  - name: Public - Subscriptions
    description: Email subscription lifecycle endpoints
  - name: Public - Auth
    description: Activation and password-reset endpoints
  - name: Admin - Auth
    description: Invite-based signup, login, MFA handoff, and logout
  - name: Admin - Session
    description: Session, trusted-device, and identity endpoints
  - name: Admin - MFA
    description: Authenticated MFA self-service endpoints
  - name: Admin - Events
    description: Event management endpoints
  - name: Admin - Bands
    description: Performance, roster-assignment, and media endpoints
  - name: Admin - Venues
    description: Venue management endpoints
  - name: Admin - Performers
    description: Global performer registry endpoints
  - name: Admin - Users
    description: User administration endpoints
  - name: Admin - Invites
    description: Invite-code management endpoints
  - name: Admin - Analytics
    description: Audit and analytics endpoints
  - name: Admin - Maintenance
    description: Administrative maintenance endpoints

paths:
  /api/schedule:
    get:
      tags:
        - Public
      summary: Get the current or named public schedule
      description: |
        Returns the public schedule as `{ event, bands }`.
        This route is gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: event
          in: query
          required: false
          description: Event slug or `current`
          schema:
            type: string
            default: current
      responses:
        "200":
          description: Public schedule response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/events/public:
    get:
      tags:
        - Public
      summary: List public events
      description: Public event discovery endpoint gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: genre
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: upcoming
          in: query
          required: false
          description: When omitted or true, only current and upcoming published events are returned.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Public events response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventsResponse"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/events/timeline:
    get:
      tags:
        - Public
      summary: Get grouped event timeline
      description: Timeline response grouped into `now`, `upcoming`, and `past` buckets.
      parameters:
        - name: now
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: upcoming
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: past
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: includeBands
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: pastLimit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Timeline response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/events/{id}/details:
    get:
      tags:
        - Public
      summary: Get public event details
      description: Returns one published or archived event with band and venue detail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/bands/{name}:
    get:
      tags:
        - Public
      summary: Get public band profile
      description: |
        Returns a public band profile and published performance history.
        `{name}` may be a numeric band ID or a normalized band name.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Band profile response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBandProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/bands/stats/{name}:
    get:
      tags:
        - Public
      summary: Get public band profile with aggregate stats
      description: Extended public band endpoint gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Band stats response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBandStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/feeds/ical:
    get:
      tags:
        - Public
      summary: Download the iCal feed
      description: Returns a public calendar feed filtered by city and genre.
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: genre
          in: query
          required: false
          schema:
            type: string
            default: all
      responses:
        "200":
          description: iCal response
          content:
            text/calendar:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/metrics:
    post:
      tags:
        - Public
      summary: Ingest privacy-safe metrics
      description: Accepts a batch of allow-listed analytics events and responds with `OK` even when the payload is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricsBatchRequest"
      responses:
        "200":
          description: Metrics payload accepted or ignored
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /api/schedule/build:
    post:
      tags:
        - Public
      summary: Record a schedule-build event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBuildRequest"
      responses:
        "200":
          description: Schedule build recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/subscriptions/subscribe:
    post:
      tags:
        - Public - Subscriptions
      summary: Create a subscription and send verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionMessageResponse"
        "200":
          description: Existing unverified subscription reused and verification resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bot verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/subscriptions/verify:
    get:
      tags:
        - Public - Subscriptions
      summary: Verify a subscription token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Verification succeeded and the client is redirected to the subscribe page
        "400":
          description: Invalid or expired token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Token not found
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Verification failed
          content:
            text/plain:
              schema:
                type: string

  /api/subscriptions/unsubscribe:
    get:
      tags:
        - Public - Subscriptions
      summary: Unsubscribe from email updates
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML unsubscribe confirmation page
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Missing token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown token
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Unsubscribe failed
          content:
            text/plain:
              schema:
                type: string

  /api/auth/activate:
    post:
      tags:
        - Public - Auth
      summary: Activate an invited user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          description: Activation succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/resend-activation:
    post:
      tags:
        - Public - Auth
      summary: Resend an activation email
      description: Returns a generic success payload even when the email does not belong to an inactive account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendActivationRequest"
      responses:
        "200":
          description: Generic resend response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/reset-password:
    get:
      tags:
        - Public - Auth
      summary: Unsupported reset-password GET route
      deprecated: true
      description: Token validation must use `POST /api/auth/reset-password/validate` so tokens never appear in URLs.
      responses:
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Public - Auth
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/reset-password/validate:
    post:
      tags:
        - Public - Auth
      summary: Validate a password-reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetTokenRequest"
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetTokenValidationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/auth/signup:
    post:
      tags:
        - Admin - Auth
      summary: Create an invite-backed admin account
      description: Same-origin protected pre-session route. The invite code determines the resulting role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and activation email sent or attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/auth/login:
    post:
      tags:
        - Admin - Auth
      summary: Log in with email and password
      description: Same-origin protected pre-session route. On success, either a session is issued immediately or an MFA challenge is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session issued or MFA required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginSuccess"
                  - $ref: "#/components/schemas/LoginMfaChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/auth/mfa/verify:
    post:
      tags:
        - Admin - Auth
      summary: Complete login with MFA
      description: Same-origin protected pre-session route. May also set a trusted-device cookie when `rememberDevice` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: MFA verification succeeded and a session was issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/auth/logout:
    post:
      tags:
        - Admin - Auth
      summary: Log out the current admin session
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: Logout response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/me:
    get:
      tags:
        - Admin - Session
      summary: Get the current authenticated admin user
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Current user response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/sessions:
    get:
      tags:
        - Admin - Session
      summary: List active sessions for the current user
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Admin - Session
      summary: Revoke one session belonging to the current user
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSessionRequest"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/sessions/revoke-all:
    post:
      tags:
        - Admin - Session
      summary: Revoke all sessions except the freshly issued current one
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: All other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/admin/trusted-devices:
    get:
      tags:
        - Admin - Session
      summary: List trusted devices for the current user
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Trusted-device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustedDevicesResponse"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Admin - Session
      summary: Revoke one trusted device
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteTrustedDeviceRequest"
      responses:
        "200":
          description: Trusted device revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/mfa/status:
    get:
      tags:
        - Admin - MFA
      summary: Get MFA status for the current user
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: MFA status response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/mfa/setup:
    post:
      tags:
        - Admin - MFA
      summary: Start MFA setup for the current user
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: TOTP secret generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/mfa/enable:
    post:
      tags:
        - Admin - MFA
      summary: Enable MFA with a TOTP code
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: MFA enabled and backup codes issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/mfa/backup-codes:
    post:
      tags:
        - Admin - MFA
      summary: Regenerate MFA backup codes
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Backup codes regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/mfa/disable:
    post:
      tags:
        - Admin - MFA
      summary: Disable MFA using a TOTP or backup code
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: MFA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/events:
    get:
      tags:
        - Admin - Events
      summary: List events
      security:
        - AdminSessionCookie: []
      parameters:
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Admin - Events
      summary: Create an event
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/events/{id}:
    patch:
      tags:
        - Admin - Events
      summary: Patch an event
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPatchInput"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Admin - Events
      summary: Delete an event
