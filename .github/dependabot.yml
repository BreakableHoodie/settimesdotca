version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Wait 7 days before proposing a newly published version -- same
    # rationale as min-release-age in .npmrc.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
    # vitest 5 is HELD (#1176): it instruments coverage differently, so the
    # same code scores 1.6-5 points lower and fails the ratchet. Remove this
    # ignore in the PR that re-baselines the thresholds.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      root-npm-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    # Wait 7 days before proposing a newly published version -- same
    # rationale as min-release-age in .npmrc.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
    # vitest 5 is HELD (#1176): it instruments coverage differently, so the
    # same code scores 1.6-5 points lower and fails the ratchet. Remove this
    # ignore in the PR that re-baselines the thresholds.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-npm-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Wait 7 days before proposing a newly published version -- same
    # rationale as min-release-age in .npmrc.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-all:
        patterns:
          - "*"
