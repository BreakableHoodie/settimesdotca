# Docs build — validation only. This workflow no longer publishes anything.
#
# docs.settimes.ca was a GitHub Pages site served from this repo. GitHub Pages
# is not available for private repositories on the Free plan, so when this repo
# went private (2026-09-16) the Pages site was disabled and the domain began
# serving GitHub's own 404. The `deploy` job and the Pages artifact upload went
# with it — `actions/deploy-pages` cannot succeed against a disabled Pages site,
# so keeping them would have meant a permanently red check, which is worse than
# no check: it trains you to ignore red.
#
# The zone's `docs.settimes.ca` CNAME (-> breakablehoodie.github.io) was deleted
# at the same time, both because it pointed at nothing and because an unclaimed
# custom domain aimed at GitHub Pages is a subdomain-takeover vector.
#
# What is left is `mkdocs build --strict`, which still catches broken internal
# links and bad nav entries. It is `workflow_dispatch` only: Actions minutes are
# metered on a private Free-plan repo, and a build whose output is never
# published does not earn a run on every docs push. Run it on demand, or locally
# (see the mkdocs venv recipe) when the docs tree changes shape.
#
# To restore publishing: re-enable Pages (needs a plan where private-repo Pages
# is available, or a public repo), re-add the `deploy` job with `pages: write`
# and `id-token: write`, restore `docs/CNAME`, and recreate the DNS record as
# CNAME docs.settimes.ca -> breakablehoodie.github.io, unproxied, TTL auto.
name: Docs Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict
