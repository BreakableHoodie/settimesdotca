name: E2E A11y + Visual

on:
    pull_request:
        branches: [main, dev]
        paths:
            - 'e2e/accessibility/**'
            - 'e2e/visual-regression.spec.js'
            - 'frontend/**'
            - '.github/actions/e2e-env/**'
            - '.github/workflows/e2e-a11y-visual.yml'
    schedule:
        - cron: '0 7 * * 1'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e-a11y-visual:
        name: e2e-a11y-visual
        runs-on: ubuntu-latest
        timeout-minutes: 35
        # Fork PRs cannot access repo secrets. Although the a11y/visual tests don't currently
        # use credentials.js, guard the job defensively so fork PRs don't break if that changes.
        # Scheduled runs (weekly) are always allowed to proceed.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            - name: E2E environment
              uses: ./.github/actions/e2e-env
              with:
                  e2e-admin-password: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  e2e-admin-email: ${{ secrets.E2E_ADMIN_EMAIL }}

            - name: Check linux snapshots exist
              env:
                  ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
              run: |
                  if [ ! -f "e2e/visual-regression.spec.js-snapshots/admin-login-chromium-linux.png" ]; then
                      echo "::notice::Linux snapshots missing — generating for artifact download..."
                      npx playwright test e2e/visual-regression.spec.js --update-snapshots || true
                      echo "SNAPSHOTS_MISSING=true" >> "$GITHUB_ENV"
                  fi

            - name: Upload generated linux snapshots
              if: env.SNAPSHOTS_MISSING == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: linux-snapshots
                  path: e2e/visual-regression.spec.js-snapshots/*-linux.png
                  retention-days: 7

            - name: Fail if linux snapshots were missing
              if: env.SNAPSHOTS_MISSING == 'true'
              run: |
                  echo "::error::Linux snapshots are missing from the repository."
                  echo "Download the 'linux-snapshots' artifact from this run, place the PNGs in"
                  echo "e2e/visual-regression.spec.js-snapshots/, commit, and push."
                  exit 1

            - name: Run Playwright tests (A11y + Visual)
              env:
                  ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
              run: npx playwright test e2e/accessibility e2e/visual-regression.spec.js --reporter=list,html

            - name: Upload Playwright report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: playwright-report-a11y-visual
                  path: playwright-report/
                  retention-days: 30
