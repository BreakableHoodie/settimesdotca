name: DAST - ZAP Baseline

# ZAP scans require a deployed target to scan.
# We only run on:
# - Weekly schedule against production
# - After successful deployment to dev branch
# Note: PR scans are disabled because Cloudflare Pages doesn't deploy PR previews

on:
  schedule:
    # Weekly scan on Monday at 7 AM UTC
    - cron: "0 7 * * 1"
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages"]
    types: [completed]
    branches: [dev]
  # Manual trigger for ad-hoc scans
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan (defaults to production)'
        required: false
        default: 'https://settimes.ca'

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize with smoke checks: both disable BFM at zone level and must not
    # run concurrently or one will restore BFM while the other still needs it.
    concurrency:
      group: cloudflare-zone-smoke
      cancel-in-progress: false
    # Only run if deployment succeeded (for workflow_run trigger)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Determine target URL
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          # workflow_dispatch: use provided URL or default to production
          # schedule: scan production
          # workflow_run (after dev deploy): scan dev environment
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            URL="${INPUT_TARGET_URL}"
            echo "url=${URL:-https://settimes.ca}" >> $GITHUB_OUTPUT
            echo "Manual scan: ${URL:-https://settimes.ca}"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            echo "url=https://settimes.ca" >> $GITHUB_OUTPUT
            echo "Scheduled scan of production: https://settimes.ca"
          else
            echo "url=https://dev.settimes.ca" >> $GITHUB_OUTPUT
            echo "Post-deployment scan of dev: https://dev.settimes.ca"
          fi

      - name: Bypass Cloudflare bot protection for runner IP
        if: contains(steps.target.outputs.url, 'settimes.ca')
        uses: xiaotianxt/bypass-cloudflare-for-github-action@0c44a8bb3b1c9d370e48be2becf88ef33de8d57e # v2.1.0
        with:
          cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_WAF_API_TOKEN }}
          disable_bot_fight_mode: true

      - name: Wait for deployment to be ready
        run: |
          TARGET="${{ steps.target.outputs.url }}"
          echo "Waiting for $TARGET to be accessible..."

          for i in {1..30}; do
            if curl -sSf "$TARGET" > /dev/null 2>&1; then
              echo "Target is ready"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 10
          done

          echo "Target not accessible after 5 minutes"
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          artifact_name: zap-baseline-report
          # Don't fail the action on alerts - we review manually
          fail_action: false
          # Create an issue with the results
          allow_issue_writing: true
          issue_title: "ZAP Baseline Scan Report"
          # Rules file for tuning alerts
          rules_file_name: ".zap/rules.tsv"

      - name: Upload ZAP Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-report
          path: |
            report_*.html
            report_*.json
            report_*.md
          retention-days: 30
